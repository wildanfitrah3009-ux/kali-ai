  <!-- Tailwind CSS CDN -->

    tailwind.config = {
      darkMode: ['selector', '[data-theme="dark"]']
    }

  <!-- Design Tokens: Anti-UI-Slop Clean Tonal -->
  <style>
    :root {
      --bg-surface: #F8FAFC;
      --bg-card: #FFFFFF;
      --bg-sidebar: #F1F5F9;
      --bg-hover: #E2E8F0;
      --border-color: #E2E8F0;
      --text-main: #0F172A;
      --text-secondary: #64748B;
      --primary: #1D4ED8;
      --primary-hover: #1E40AF;
      --primary-bg: #EFF6FF;
    }

    [data-theme="light"] {
      --bg-surface: #F8FAFC;
      --bg-card: #FFFFFF;
      --bg-sidebar: #F1F5F9;
      --bg-hover: #E2E8F0;
      --border-color: #E2E8F0;
      --text-main: #0F172A;
      --text-secondary: #64748B;
      --primary: #1D4ED8;
      --primary-hover: #1E40AF;
      --primary-bg: #EFF6FF;
    }

    [data-theme="dark"] {
      --bg-surface: #0F1115;
      --bg-card: #16181D;
      --bg-sidebar: #111318;
      --bg-hover: #22252D;
      --border-color: #2A2D34;
      --text-main: #F1F5F9;
      --text-secondary: #94A3B8;
      --primary: #60A5FA;
      --primary-hover: #93C5FD;
      --primary-bg: #1E3A8A;
    }

    * { box-sizing: border-box; }
    html, body, #root { height: 100%; width: 100%; }
    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: var(--bg-surface);
      color: var(--text-main);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    code, pre { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace; }

    /* Custom subtle scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

    /* Styling untuk blok kode Markdown */
    pre {
      background-color: #0d1117 !important;
      border-radius: 8px;
      padding: 12px;
      overflow-x: auto;
      margin: 12px 0;
    }
    pre code {
      background-color: transparent !important;
      padding: 0 !important;
      font-size: 13px;
      font-family: 'JetBrains Mono', monospace;
    }
    /* Styling untuk teks tebal, miring, dan daftar */
    .prose strong { font-weight: 600; color: var(--text-main); }
    .prose ul { list-style-type: disc; padding-left: 20px; margin: 8px 0; }
    .prose ol { list-style-type: decimal; padding-left: 20px; margin: 8px 0; }
    .prose p { margin-bottom: 8px; }

    /* Styling untuk blok kode Markdown */
    pre {
      background-color: #0d1117 !important;
      border-radius: 8px;
      padding: 12px;
      overflow-x: auto;
      margin: 12px 0;
    }
    pre code {
      background-color: transparent !important;
      padding: 0 !important;
      font-size: 13px;
      font-family: 'JetBrains Mono', monospace;
    }
    /* Styling untuk teks tebal, miring, dan daftar */
    .prose strong { font-weight: 600; color: var(--text-main); }
    .prose ul { list-style-type: disc; padding-left: 20px; margin: 8px 0; }
    .prose ol { list-style-type: decimal; padding-left: 20px; margin: 8px 0; }
    .prose p { margin-bottom: 8px; }

    /* Subtle mesh gradient for light mode */
    .bg-mesh-light {
      background-image: 
        radial-gradient(at 0% 0%, rgba(239, 246, 255, 0.5) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(241, 245, 249, 0.5) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(239, 246, 255, 0.5) 0px, transparent 50%),
        radial-gradient(at 0% 100%, rgba(241, 245, 249, 0.5) 0px, transparent 50%);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Bootstrap -->
  <script type="text/babel">
    (function mount() {
      const rootEl = document.getElementById('root');
      if (!window.KalaAiComponents || !window.KalaAiComponents.Header) {
        rootEl.innerHTML =
          '<div style="padding:24px;font-family:monospace;color:#e55">Gagal memuat komponen. Periksa konsol browser.</div>';
        return;
      }
      const AppComponent = window.App || (typeof App !== 'undefined' ? App : null);
      if (!AppComponent) {
        rootEl.innerHTML =
          '<div style="padding:24px;font-family:monospace;color:#e55">Gagal memuat App.jsx.</div>';
        return;
      }
      const root = ReactDOM.createRoot(rootEl);
      root.render(React.createElement(AppComponent));
    })();
  </script>
